<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sana, NAZLIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Figtree:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#150a1c; --plum:#2e0f33; --wine:#4a1238;
    --rose:#ff4d79; --blush:#ffc2d1; --gold:#f6d7a7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--night);color:var(--blush);
    font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:
      radial-gradient(120% 90% at 50% 110%, var(--wine) 0%, transparent 60%),
      radial-gradient(90% 70% at 50% -10%, var(--plum) 0%, transparent 65%),
      var(--night);}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- Açılış ekranı ---------- */
  #intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2rem;padding:2rem;text-align:center;cursor:pointer;
    background:radial-gradient(circle at 50% 45%, rgba(74,18,56,.55), var(--night) 70%);
    transition:opacity 1.2s ease, visibility 1.2s}
  #intro.gone{opacity:0;visibility:hidden}
  #intro svg{width:min(34vw,150px);height:auto;filter:drop-shadow(0 0 28px rgba(255,77,121,.65));
    animation:beat 1.4s ease-in-out infinite}
  #intro h1{font-family:"Pinyon Script",cursive;font-weight:400;font-size:clamp(2rem,7vw,3.2rem);
    color:var(--gold);line-height:1.2}
  #intro p{font-weight:300;font-size:.95rem;letter-spacing:.12em;color:var(--blush);opacity:.75;
    animation:breathe 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.09)}}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}

  /* ---------- Ana sahne ---------- */
  #stage{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:2rem 1.5rem;pointer-events:none}
  #name{font-family:"Pinyon Script",cursive;font-size:clamp(4rem,17vw,9rem);line-height:1;color:var(--gold);
    text-shadow:0 0 40px rgba(255,77,121,.55),0 0 90px rgba(255,77,121,.25);
    opacity:0;transform:scale(.92);transition:opacity 2s ease, transform 2.4s cubic-bezier(.2,.7,.2,1)}
  #stage.on #name{opacity:1;transform:scale(1)}
  #msg{margin-top:2.2rem;min-height:7.5em;max-width:30ch;font-weight:300;
    font-size:clamp(1.25rem,4.6vw,1.9rem);line-height:1.55;color:#fff2f5}
  #msg span{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(8px);
    animation:word .9s ease forwards}
  #msg.out span{animation:wordout .7s ease forwards}
  @keyframes word{to{opacity:1;filter:blur(0);transform:none}}
  @keyframes wordout{from{opacity:1}to{opacity:0;filter:blur(6px)}}
  #days{position:fixed;z-index:10;left:0;right:0;bottom:max(1.6rem,env(safe-area-inset-bottom));
    text-align:center;font-size:.9rem;font-weight:300;color:var(--blush);opacity:0;transition:opacity 2s ease 2s}
  #days b{font-weight:500;color:var(--gold);font-size:1.15rem}
  #stage.on ~ #days{opacity:.85}
  #hint{position:fixed;z-index:10;top:max(1.2rem,env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:.8rem;font-weight:300;opacity:0;transition:opacity 2s ease 4s;color:var(--blush)}
  #stage.on ~ #hint{opacity:.5}

  @media (prefers-reduced-motion:reduce){
    #intro svg,#intro p{animation:none}
    #msg span{animation-duration:.01s}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="stage">
  <div id="name">NAZLIM</div>
  <div id="msg" aria-live="polite"></div>
</div>
<div id="days"></div>
<div id="hint">Ekrana dokun, kalpler uçsun</div>

<div id="intro" role="button" tabindex="0" aria-label="Başla">
  <svg viewBox="0 0 32 29" fill="none"><path d="M16 28.5C-8 12 3-3 16 7.5 29-3 40 12 16 28.5Z"
    fill="url(#g)"/><defs><linearGradient id="g" x1="16" y1="2" x2="16" y2="28"><stop stop-color="#ff7a9c"/>
    <stop offset="1" stop-color="#e0245e"/></linearGradient></defs></svg>
  <h1>Sana küçük bir sürprizim var</h1>
  <p>Dokun</p>
</div>

<script>
const SOZLER = ["Seninle geçen her gün, hayatımın en güzel günü.", "Gülüşün, dünyadaki en sevdiğim yer.", "İyi ki varsın, iyi ki benimsin.", "Yanında olunca zaman duruyor, kalbim ise hızlanıyor.", "Birinci ayımız kutlu olsun.", "Seni seviyorum. Dün de, bugün de, her zaman."];
const START  = "06.10.2026";
const COLORS = ["#ff4d79","#ff7a9c","#ffc2d1","#f6d7a7","#e0245e"];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Canvas: kalpler ve yıldızlar ---------- */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();

function heart(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x, y+s*.3);
  ctx.bezierCurveTo(x, y, x-s*.5, y, x-s*.5, y+s*.3);
  ctx.bezierCurveTo(x-s*.5, y+s*.6, x, y+s*.8, x, y+s);
  ctx.bezierCurveTo(x, y+s*.8, x+s*.5, y+s*.6, x+s*.5, y+s*.3);
  ctx.bezierCurveTo(x+s*.5, y, x, y, x, y+s*.3);
  ctx.fill();
}

const rand = (a,b)=>a+Math.random()*(b-a);
const stars = Array.from({length: 70}, () => ({x:rand(0,1), y:rand(0,1), r:rand(.4,1.4), p:rand(0,6.28), v:rand(.4,1.2)}));
let hearts = [], bursts = [], running = false;

function spawnRiser(initial){
  const s = rand(10, 34);
  hearts.push({
    x: rand(0, W), y: initial ? rand(0, H) : H + s,
    s, vy: rand(.25, .9) * (36 - s) / 20 + .2, sway: rand(.4, 1.6), ph: rand(0, 6.28),
    a: rand(.25, .75), c: COLORS[(Math.random()*COLORS.length)|0]
  });
}
function burst(x, y){
  const n = reduce ? 6 : 16;
  for(let i=0;i<n;i++){
    const ang = rand(0, 6.28), sp = rand(1.5, 5);
    bursts.push({x, y, s: rand(10, 26), vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 1.5,
      a: 1, c: COLORS[(Math.random()*COLORS.length)|0]});
  }
}

let last = 0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min((t - last) / 16.7 || 1, 3); last = t;
  ctx.clearRect(0, 0, W, H);

  for(const st of stars){
    ctx.globalAlpha = .25 + .35 * Math.sin(t/1000*st.v + st.p);
    ctx.fillStyle = "#fff4ea";
    ctx.beginPath(); ctx.arc(st.x*W, st.y*H, st.r, 0, 6.28); ctx.fill();
  }

  if(running && !reduce && hearts.length < Math.min(60, W/16) && Math.random() < .12*dt) spawnRiser(false);
  for(let i=hearts.length-1; i>=0; i--){
    const h = hearts[i];
    h.y -= h.vy*dt; h.ph += .012*dt;
    const x = h.x + Math.sin(h.ph)*h.sway*18;
    ctx.globalAlpha = h.a * Math.min(1, h.y / (H*.25)); ctx.fillStyle = h.c;
    ctx.shadowColor = h.c; ctx.shadowBlur = 12;
    heart(x, h.y, h.s);
    if(h.y < -h.s) hearts.splice(i, 1);
  }
  for(let i=bursts.length-1; i>=0; i--){
    const b = bursts[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.vy += .09*dt; b.vx *= .985; b.a -= .014*dt;
    if(b.a <= 0){ bursts.splice(i,1); continue; }
    ctx.globalAlpha = b.a; ctx.fillStyle = b.c; ctx.shadowColor = b.c; ctx.shadowBlur = 14;
    heart(b.x, b.y, b.s);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}
for(let i=0;i<(reduce?8:26);i++) spawnRiser(true);
requestAnimationFrame(frame);

addEventListener("pointerdown", e => { if(running) burst(e.clientX, e.clientY); });

/* ---------- Sözler ---------- */
const msg = document.getElementById("msg");
let idx = 0;
function showMessage(){
  msg.classList.remove("out");
  msg.innerHTML = "";
  SOZLER[idx].split(" ").forEach((w, i) => {
    const s = document.createElement("span");
    s.textContent = w + "\u00a0";
    s.style.animationDelay = (i * 0.18) + "s";
    msg.appendChild(s);
  });
  const words = SOZLER[idx].split(" ").length;
  const hold = 2600 + words * 450;
  setTimeout(() => msg.classList.add("out"), hold);
  setTimeout(() => { idx = (idx + 1) % SOZLER.length; showMessage(); }, hold + 800);
}

/* ---------- Birlikte geçen gün ---------- */
function updateDays(){
  const el = document.getElementById("days");
  if(!START) return;
  const d = new Date(START + "T00:00:00");
  if(isNaN(d)) return;
  const n = Math.max(0, Math.floor((Date.now() - d) / 864e5));
  el.innerHTML = "Birlikte geçen <b>" + n.toLocaleString("tr-TR") + "</b> gün";
}

/* ---------- Başlat ---------- */
const intro = document.getElementById("intro");
function begin(e){
  if(running) return;
  running = true;
  intro.classList.add("gone");
  document.getElementById("stage").classList.add("on");
  burst(W/2, H/2);
  updateDays();
  setTimeout(showMessage, 2200);
}
intro.addEventListener("click", begin);
intro.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " ") begin(); });
</script>
</body>
</html>
